<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Login/Sign in</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Utilizador</label>
                <input type="text" id="username" placeholder="Digite o utilizador">
            </div>

            <!-- Campo de email que aparece ao clicar em Criar Conta -->
            <div class="form-group escondido" id="emailField">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Digite o seu email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Digite a password">
            </div>
            
            <button type="submit" class="login-btn">Entrar</button>
            <button type="button" id="meuBotao" class="login-btn">Criar Conta</button>
            
            <div id="elementoParaEsconder">
                <button type="button" class="login-btn" onclick="skipLogin()" style="background: #95a5a6; margin-top: 10px;">Continuar sem Login</button>
            </div>
            
            <div class="error" id="errorMsg"></div>
        </form>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
